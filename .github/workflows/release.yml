name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: Normal Changesets flow or the one-time first publication
        type: choice
        options:
          - normal
          - bootstrap
        default: normal
      initial-version:
        description: Confirm the version for bootstrap mode
        type: string
        required: true
        default: '0.1.0'

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.mode == 'normal')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout main
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check release
        uses: ./.github/actions/release-check

      - name: Check initial publication
        id: registry
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const response = await fetch('https://registry.npmjs.org/@react-native-motion-kit%2ftext-motion', {
            signal: AbortSignal.timeout(30000),
          });
          if (response.status !== 404 && !response.ok) {
            throw new Error(`Registry lookup failed: ${response.status}`);
          }
          const initialized = response.ok;
          appendFileSync(process.env.GITHUB_OUTPUT, `initialized=${initialized}\n`);
          if (!initialized) {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              'The package is not public yet. Follow RELEASING.md and run Release in bootstrap mode once.\n');
          }
          JS

      - name: Create version PR or publish with OIDC
        if: steps.registry.outputs.initialized == 'true'
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
          version-script: pnpm changeset version
          publish-script: pnpm changeset publish
          create-github-releases: true
          push-git-tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bootstrap:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'bootstrap'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      pull-requests: write
      id-token: none
    steps:
      - name: Require the one-time npm credential
        shell: bash
        env:
          BOOTSTRAP_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$BOOTSTRAP_TOKEN" ]; then
            echo '::error::Add the initial NPM_TOKEN credential described in RELEASING.md.'
            exit 1
          fi
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo '::error::Run bootstrap from the main branch.'
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check the initial release
        uses: ./.github/actions/release-check
        with:
          expected-version: ${{ inputs.initial-version }}

      - name: Require an initial release without pending version changes
        shell: bash
        run: |
          if find .changeset -maxdepth 1 -name '*.md' ! -name README.md -print -quit | grep -q .; then
            echo '::error::Bootstrap publishes the existing version; resolve pending changesets first.'
            exit 1
          fi

      - name: Configure initial registry authentication
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Publish the first version from CI
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
          version-script: pnpm changeset version
          publish-script: pnpm changeset publish
          create-github-releases: true
          push-git-tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'false'
